name: offline-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Pin a reviewed commit before first external/public release.
      - uses: actions/checkout@v4
      - name: Install host-side test tools
        run: sudo apt-get update && sudo apt-get install -y jq busybox util-linux
      - name: Tests (no router, no privileged network access)
        run: make test
      - name: Offline preview and source package
        run: make preview package
