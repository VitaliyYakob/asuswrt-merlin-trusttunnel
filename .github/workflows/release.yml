name: Подготовка релиза
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Существующий тег v<VERSION>; создаёт черновик предварительного релиза'
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    name: Сборка черновика релиза
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - name: Проверка тега и версии исходников
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$'
          test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Зависимости для автономных тестов
        run: sudo apt-get update && sudo apt-get install -y jq busybox util-linux openssl shellcheck
      - name: Проверки и сборка закреплённого IPK
        run: |
          make test lint preview package
          git diff --exit-code -- install-online.sh
      - name: Создание черновика предварительного релиза с файлами
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Предварительный релиз $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md dist/*.ipk dist/*.zip dist/*.tar.gz dist/SHA256SUMS
