name: Автономные проверки
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Проверка исходников и пакетов
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Проверка сканера, поиск секретов в истории и исходниках
        run: |
          work="$RUNNER_TEMP/ttm-gitleaks"
          mkdir -m 700 "$work"
          curl --fail --location --proto '=https' --proto-redir '=https' https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$work/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$work/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$work/gitleaks.tar.gz" -C "$work" gitleaks
          "$work/gitleaks" git . --config .gitleaks.toml --log-opts=--all --redact --no-banner
          "$work/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
      - name: Установка инструментов тестирования
        run: sudo apt-get update && sudo apt-get install -y jq busybox util-linux openssl shellcheck
      - name: Автономные тесты без роутера и изменения сети
        run: make test
      - name: ShellCheck — ошибки и предупреждения
        run: make lint
      - name: Установка закреплённых браузерных инструментов
        run: |
          npm install --prefix "$RUNNER_TEMP/ttm-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/ttm-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          echo "NODE_PATH=$RUNNER_TEMP/ttm-browser/node_modules" >> "$GITHUB_ENV"
      - name: Браузерные регрессии на модели роутера
        run: make browser-test
      - name: Автономный предпросмотр и пакеты
        run: |
          make preview package
          git diff --exit-code -- install-online.sh
          "$RUNNER_TEMP/ttm-gitleaks/gitleaks" dir dist --config .gitleaks.toml --max-archive-depth 2 --redact --no-banner
